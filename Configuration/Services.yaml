services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Kitodo\Dlf\:
    resource: '../Classes/*'

  Kitodo\Dlf\Command\HarvestCommand:
    tags:
      - name: 'console.command'
        command: 'kitodo:harvest'

  Kitodo\Dlf\Command\IndexCommand:
    tags:
      - name: 'console.command'
        command: 'kitodo:index'

  Kitodo\Dlf\Command\ReindexCommand:
    tags:
      - name: 'console.command'
        command: 'kitodo:reindex'

  Kitodo\Dlf\Service\DocumentService:
    autowire: true
    autoconfigure: true
    public: true

  Kitodo\Dlf\Controller\AbstractController:
    calls:
      - method: 'injectDocumentService'
        arguments:
          $service: '@Kitodo\Dlf\Service\DocumentService'
      - method: 'injectObjectManager'
        arguments:
          $objectManager: '@TYPO3\CMS\Extbase\Object\ObjectManager'